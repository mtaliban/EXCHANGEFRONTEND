name: Frontend CD

# ============================================================
# CD — Deploy production.
# Inaanza TU baada ya "Frontend CI" kufaulu (workflow_run).
# Hatua:
#   1) Docker build + push kwenye Docker Hub (version tags)
#   2) Vercel deploy (Production) — kila push ya main
# ============================================================

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  docker-push:
    name: CD 1/2 — Docker Hub (build + push)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Build & push image (version tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mtalibani/kubadilishanafrontend:latest
            mtalibani/kubadilishanafrontend:${{ github.event.workflow_run.head_sha }}
            mtalibani/kubadilishanafrontend:1.0.${{ github.run_number }}

  deploy-vercel:
    name: CD 2/2 — Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs: docker-push
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build + Deploy to Vercel
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
