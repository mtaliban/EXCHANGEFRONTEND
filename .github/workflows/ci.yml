name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm run test

      - name: Build (Next.js standalone)
        env:
          NEXT_PUBLIC_AUTH_API: http://localhost:8001
          NEXT_PUBLIC_USER_API: http://localhost:8002
          NEXT_PUBLIC_LOCATION_API: http://localhost:8003
          NEXT_PUBLIC_MATCH_API: http://localhost:8004
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (validate Dockerfile — not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kv-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
