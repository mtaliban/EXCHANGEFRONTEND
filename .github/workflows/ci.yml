name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm run test

      - name: Build (Next.js)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (validate Dockerfile — not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kv-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
