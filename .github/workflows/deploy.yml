name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Deploy ina-run tu kama secrets zote 3 zipo. Ukikosa hata moja,
      # step ina-skip kwa rafiki — sio fail nyekundu.
      - name: Build + Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Skip notice (Vercel secrets bado hazijawekwa)
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "::warning::Vercel secrets hazijawekwa bado — deploy imeskipped (hii ni sawa)."
          echo "Weka VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID kwenye:"
          echo "https://github.com/mtaliban/EXCHANGEFRONTEND/settings/secrets/actions"
