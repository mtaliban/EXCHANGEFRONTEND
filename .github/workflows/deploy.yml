name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build + Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    # Skip (sio fail) hadi secrets za Vercel ziwekwe kwenye GitHub.
    # Ukiweka VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID, job hii
    # ita-run na kudeploy automatically kila push kwenye main.
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Env vars za app (k.m. NEXT_PUBLIC_API_URL) huwekwa kwenye Vercel
      # Project Settings → Environment Variables, na vercel pull huzipakua.
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
